[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-naming-study"
version = "0.1.0"
description = "Scaffold and validate research-led naming studies"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Santi Pochat"}]

[project.scripts]
deep-naming-study = "deep_naming_study.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
